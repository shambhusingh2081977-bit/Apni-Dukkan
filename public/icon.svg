<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4" />

  <!-- Main Storefront & Rupee Icon -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Shop Roof Awning -->
    <path d="M 16 96 L 304 96 L 272 32 L 48 32 Z" fill="#ffffff" />
    <path d="M 48 32 L 80 96 L 112 32 L 144 96 L 176 32 L 208 96 L 240 32 L 272 96 L 304 96" fill="none" stroke="#059669" stroke-width="8" stroke-linejoin="round" />

    <!-- Awning Scallops -->
    <path d="M 16 96 Q 32 120 48 96 Q 64 120 80 96 Q 96 120 112 96 Q 128 120 144 96 Q 160 120 176 96 Q 192 120 208 96 Q 224 120 240 96 Q 256 120 272 96 Q 288 120 304 96" fill="#ffffff" />

    <!-- Store Base Walls -->
    <rect x="36" y="112" width="248" height="176" rx="16" fill="#ffffff" fill-opacity="0.95" />

    <!-- Store Counter Window -->
    <rect x="60" y="136" width="200" height="96" rx="12" fill="#0f172a" />

    <!-- Indian Rupee Badge in Window -->
    <circle cx="160" cy="184" r="36" fill="url(#goldGrad)" />
    <!-- Rupee symbol path (₹) -->
    <path d="M 148 168 L 172 168 M 148 176 L 172 176 M 156 168 L 156 182 Q 168 182 168 190 Q 168 198 156 198 L 148 198 L 170 206" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Store Entrance Base / Checkout Bar -->
    <rect x="52" y="248" width="216" height="24" rx="6" fill="#10b981" />
  </g>
</svg>
